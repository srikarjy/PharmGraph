# Kubernetes Secrets Template
# This file shows the structure for Kubernetes secrets
# DO NOT put actual secrets in this file

apiVersion: v1
kind: Secret
metadata:
  name: pharmacogenomics-secrets
  namespace: default
type: Opaque
data:
  # Base64 encoded values (use: echo -n "value" | base64)
  database-password: <base64-encoded-password>
  ncbi-api-key: <base64-encoded-api-key>
  jwt-secret-key: <base64-encoded-jwt-secret>
  redis-password: <base64-encoded-redis-password>

---
apiVersion: v1
kind: Secret
metadata:
  name: pharmacogenomics-tls
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-certificate>
  tls.key: <base64-encoded-private-key>

---
# Example ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pharmacogenomics-config
  namespace: default
data:
  app-env: "production"
  log-level: "INFO"
  api-workers: "8"
  database-pool-size: "50"
  redis-db: "0"
  ncbi-tool: "pharmacogenomics-platform"
  enable-metrics: "true"
  metrics-port: "9090"