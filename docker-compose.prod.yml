# Docker Compose for Production Deployment
# Optimized for high availability and performance

version: '3.8'

services:
  # Production API service
  pharmacogenomics-api:
    build:
      target: production
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - API_WORKERS=8
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - api_logs:/app/logs
      - ./models:/app/models:ro
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Production ML server
  pharmacogenomics-ml:
    build:
      target: ml-serving
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - MODEL_CACHE_SIZE=10
      - ML_BATCH_SIZE=64
    volumes:
      - ./models:/app/models:ro
      - ml_cache:/app/cache
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'
      update_config:
        parallelism: 1
        delay: 60s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # Production worker
  pharmacogenomics-worker:
    build:
      target: production
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - WORKER_CONCURRENCY=8
    volumes:
      - worker_data:/app/data
      - worker_logs:/app/logs
    deploy:
      replicas: 4
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Production analytics
  pharmacogenomics-analytics:
    build:
      target: production
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - analytics_reports:/app/reports
      - analytics_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Production PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=pharmacogenomics
      - POSTGRES_USER=pgx_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
      - ./docker/postgresql.prod.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgx_user -d pharmacogenomics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Production Redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
      - ./docker/redis.prod.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Production MLflow
  mlflow:
    image: python:3.11-slim
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://pgx_user:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      sh -c "pip install mlflow psycopg2-binary &&
             mlflow server --host 0.0.0.0 --port 5000 
             --backend-store-uri postgresql://pgx_user:${POSTGRES_PASSWORD}@postgres:5432/mlflow 
             --default-artifact-root /mlflow/artifacts"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Production monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/prod:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - pharmacogenomics-api
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  redis_data:
    driver: local
  mlflow_artifacts:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  api_logs:
    driver: local
  ml_cache:
    driver: local
  worker_data:
    driver: local
  worker_logs:
    driver: local
  analytics_reports:
    driver: local
  analytics_logs:
    driver: local
  nginx_logs:
    driver: local