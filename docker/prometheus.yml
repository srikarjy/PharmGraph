# Prometheus configuration for Pharmacogenomics ML Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API service metrics
  - job_name: 'pharmacogenomics-api'
    static_configs:
      - targets: ['pharmacogenomics-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ML server metrics
  - job_name: 'pharmacogenomics-ml'
    static_configs:
      - targets: ['pharmacogenomics-ml:8001']
    metrics_path: '/metrics'
    scrape_interval: 60s

  # Analytics service metrics
  - job_name: 'pharmacogenomics-analytics'
    static_configs:
      - targets: ['pharmacogenomics-analytics:8002']
    metrics_path: '/metrics'
    scrape_interval: 60s

  # PostgreSQL metrics (if postgres_exporter is added)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis metrics (if redis_exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Node exporter for system metrics (if added)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093