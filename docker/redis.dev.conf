# Redis development configuration
# More verbose logging and debugging features enabled

# Network and security
bind 0.0.0.0
port 6379
protected-mode no

# Memory management (smaller for development)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (more frequent saves for development)
save 300 1
save 60 10
save 30 100

# Logging (more verbose for development)
loglevel debug
logfile ""

# Performance
tcp-keepalive 300
timeout 0

# Database configuration
databases 16

# Append only file
appendonly yes
appendfsync always

# Slow log (capture more queries in development)
slowlog-log-slower-than 1000
slowlog-max-len 256

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Development-specific settings
notify-keyspace-events Ex

# Enable debug commands
enable-debug-command yes

# Lua scripting
lua-time-limit 5000