# Docker Compose for Pharmacogenomics ML Platform
# Development and testing environment

version: '3.8'

services:
  # Main API service
  pharmacogenomics-api:
    build:
      context: .
      dockerfile: dockerfiles/api.Dockerfile
    container_name: pgx-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://pgx_user:pgx_password@postgres:5432/pharmacogenomics
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - NCBI_EMAIL=${NCBI_EMAIL:-dev@pharmacogenomics.org}
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - SECRET_KEY=dev-secret-key-change-in-production
      - WAIT_FOR_SERVICES=postgres:5432 redis:6379
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - api_cache:/app/cache
    depends_on:
      - postgres
      - redis
    networks:
      - pgx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ML serving service
  pharmacogenomics-ml:
    build:
      context: .
      dockerfile: dockerfiles/ml-server.Dockerfile
    container_name: pgx-ml-server
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/2
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_CACHE_SIZE=3
      - ML_BATCH_SIZE=16
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ml_cache:/app/cache
      - ./logs:/app/logs
    depends_on:
      - redis
      - mlflow
    networks:
      - pgx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Data processing worker
  pharmacogenomics-worker:
    build:
      context: .
      dockerfile: dockerfiles/data-processor.Dockerfile
    container_name: pgx-worker
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://pgx_user:pgx_password@postgres:5432/pharmacogenomics
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/3
      - NCBI_EMAIL=${NCBI_EMAIL:-dev@pharmacogenomics.org}
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - WORKER_CONCURRENCY=2
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - worker_temp:/app/temp
    depends_on:
      - postgres
      - redis
    networks:
      - pgx-network
    restart: unless-stopped
    deploy:
      replicas: 1

  # Analytics service
  pharmacogenomics-analytics:
    build:
      context: .
      dockerfile: dockerfiles/analytics.Dockerfile
    container_name: pgx-analytics
    ports:
      - "8002:8002"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://pgx_user:pgx_password@postgres:5432/pharmacogenomics
      - REDIS_URL=redis://redis:6379/4
    volumes:
      - ./src:/app/src
      - ./reports:/app/reports
      - ./visualizations:/app/visualizations
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - pgx-network
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: pgx-postgres
    environment:
      - POSTGRES_DB=pharmacogenomics
      - POSTGRES_USER=pgx_user
      - POSTGRES_PASSWORD=pgx_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - pgx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgx_user -d pharmacogenomics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis cache and message broker
  redis:
    image: redis:7-alpine
    container_name: pgx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - pgx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MLflow tracking server
  mlflow:
    image: python:3.11-slim
    container_name: pgx-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://pgx_user:pgx_password@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      sh -c "pip install mlflow psycopg2-binary &&
             mlflow server --host 0.0.0.0 --port 5000 
             --backend-store-uri postgresql://pgx_user:pgx_password@postgres:5432/mlflow 
             --default-artifact-root /mlflow/artifacts"
    depends_on:
      - postgres
    networks:
      - pgx-network
    restart: unless-stopped

  # Apache Kafka for streaming (optional)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: pgx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - pgx-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: pgx-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - pgx-network
    restart: unless-stopped

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: pgx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - pgx-network
    restart: unless-stopped

  # Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: pgx-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - pgx-network
    restart: unless-stopped

  # Elasticsearch for logging (optional)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: pgx-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - pgx-network
    restart: unless-stopped

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: pgx-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - pgx-network
    restart: unless-stopped

  # Development tools
  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: pgx-jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=pharmacogenomics
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data:ro
      - ./src:/home/jovyan/src:ro
    networks:
      - pgx-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mlflow_artifacts:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  api_cache:
    driver: local
  ml_cache:
    driver: local
  worker_temp:
    driver: local

networks:
  pgx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16